                        value: <+trigger.prNumber>
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          echo "🔍 Checking GitHub PR approval status..."
                          export VAULT_ADDR="$vault_addr"
                          export VAULT_TOKEN="$vault_token"
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          if command -v microdnf >/dev/null 2>&1; then
                            microdnf install -y jq unzip wget || true
                          fi

                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)

                          echo "Checking PR #${PR_NUMBER} approval status..."

                          # Poll for PR approval (check every 30 seconds for up to 24 hours)
                          MAX_ATTEMPTS=2880  # 24 hours
                          ATTEMPT=0

                          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
                            # Get PR reviews
                            REVIEWS=$(curl -s \
                              -H "Authorization: token $GITHUB_TOKEN" \
                              -H "Accept: application/vnd.github.v3+json" \
                              "https://api.github.com/repos/${GITHUB_REPO}/pulls/${PR_NUMBER}/reviews")

                            # Check if there's an approved review
                            APPROVED=$(echo "$REVIEWS" | jq -r '[.[] | select(.state == "APPROVED")] | length')

                            if [ "$APPROVED" -gt 0 ]; then
                              APPROVER=$(echo "$REVIEWS" | jq -r '[.[] | select(.state == "APPROVED")] | .[0].user.login')
                              echo "✅ PR approved by @${APPROVER}"
                              echo "✅ Harness pipeline will continue automatically"
                              exit 0
                            fi

                            ATTEMPT=$((ATTEMPT + 1))
                            echo "⏳ Waiting for PR approval... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
                            sleep 30
                          done

                          echo "❌ Timeout: No approval received within 24 hours"
                          exit 1
