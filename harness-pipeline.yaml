                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)
                          PIPELINE_URL="https://app.harness.io/ng/account/<+account.identifier>/module/cd/orgs/<+org.identifier>/projects/<+project.identifier>/pipelines/<+pipeline.identifier>/executions/<+pipeline.executionId>/pipeline"

                          # Detect new EC2 environments by comparing PR branch .auto.tfvars files with Vault
                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)
                          PR_HEAD_REF="<+trigger.sourceBranch>"

                          # Clone the PR branch to check for .auto.tfvars files
                          rm -rf /tmp/infra_check
                          echo "Checking PR branch: $PR_HEAD_REF"
                          git clone -b "$PR_HEAD_REF" https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git /tmp/infra_check
                          cd /tmp/infra_check/terraform/ec2

                          # Get existing environments from Vault
                          EXISTING_ENVS=$(vault kv list -format=json secret/ami-pipeline/ec2 2>/dev/null | jq -r '.[]' || echo "")
                          echo "Existing environments in Vault: $EXISTING_ENVS"

                          # Find all .auto.tfvars files in PR branch and check which ones don't exist in Vault yet
                          NEW_ENVS=""
                          for TFVARS_FILE in *.auto.tfvars; do
                            [ -f "$TFVARS_FILE" ] || continue
                            ENV_NAME="${TFVARS_FILE%.auto.tfvars}"

                            # Check if this environment exists in Vault
                            if ! echo "$EXISTING_ENVS" | grep -q "^${ENV_NAME}$"; then
