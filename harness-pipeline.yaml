                              echo "New environment detected: $ENV_NAME"
                              if [ -z "$NEW_ENVS" ]; then
                                NEW_ENVS="$ENV_NAME"
                              else
                                NEW_ENVS="$NEW_ENVS, $ENV_NAME"
                              fi
                            fi
                          done

                          cd -
                          rm -rf /tmp/infra_check

                          # Get plan IDs and check if they were skipped
                          S3_PLAN_ID="<+pipeline.stages.plan_infrastructure.spec.execution.steps.plan_s3.output.outputVariables.S3_RUN_ID>"
                          NETWORK_PLAN_ID="<+pipeline.stages.plan_infrastructure.spec.execution.steps.plan_network.output.outputVariables.NETWORK_RUN_ID>"
                          S3_EXISTS="<+pipeline.stages.check_s3.spec.execution.steps.tf_check_s3.output.outputVariables.S3_EXISTS>"

                          # Build infrastructure plans section
                          INFRA_PLANS=""
                          if [ "$S3_EXISTS" = "true" ]; then
                            INFRA_PLANS="- **S3 Bucket:** ✅ Already exists (skipped)"
                          elif [ -n "$S3_PLAN_ID" ] && [ "$S3_PLAN_ID" != "null" ]; then
                            INFRA_PLANS="- **S3 Bucket Plan:** \`${S3_PLAN_ID}\`"
                          else
                            INFRA_PLANS="- **S3 Bucket:** ⏭️ Skipped"
                          fi

