pipeline:
  name: ami-build-pipeline
  identifier: ami_build_pipeline
  projectIdentifier: amipipeline
  orgIdentifier: default
  tags:
    github_repo: csgorham/bob-automation-nw
  variables:
    - name: ENVIRONMENT
      type: String
      description: Environment to deploy (dev, prod, staging, etc.)
      value: dev
      required: false
  stages:
    - stage:
        name: Check S3
        identifier: check_s3
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Terraform Check S3 Bucket
                  identifier: tf_check_s3
                  type: ShellScript
                  spec:
                    shell: Bash
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          set -e
                          export VAULT_ADDR=$vault_addr
                          export VAULT_TOKEN=$vault_token
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"
                          WORKSPACE_ID="ws-cXnGs9Q6vwxcNheL"

                          # Debug: Print trigger information
                          echo "════════════════════════════════════════"
                          echo "DEBUG: Trigger Information"
                          echo "════════════════════════════════════════"
                          echo "Source Branch: <+trigger.sourceBranch>"
                          echo "Target Branch: <+trigger.targetBranch>"
                          echo "PR Number: <+trigger.prNumber>"
                          echo "════════════════════════════════════════"
                          echo ""

                          # Install dependencies with better error handling
                          echo "Installing dependencies..."
                          if command -v microdnf >/dev/null 2>&1; then
                            echo "Using microdnf..."
                            microdnf clean all 2>/dev/null || true
                            # Install packages one by one to see which ones fail
                            microdnf install -y wget 2>/dev/null || echo "⚠️  wget install failed"
                            microdnf install -y tar 2>/dev/null || echo "⚠️  tar install failed"
                            microdnf install -y gzip 2>/dev/null || echo "⚠️  gzip install failed"
                            microdnf install -y curl 2>/dev/null || echo "⚠️  curl install failed"
                            microdnf install -y unzip 2>/dev/null || echo "⚠️  unzip install failed"
                            microdnf install -y jq 2>/dev/null || echo "⚠️  jq not available via microdnf, will install manually"
                          elif command -v apt-get >/dev/null 2>&1; then
                            echo "Using apt-get..."
                            apt-get update -qq && apt-get install -y -qq jq unzip wget curl
                          elif command -v yum >/dev/null 2>&1; then
                            echo "Using yum..."
                            yum install -y jq unzip wget curl || true
                          elif command -v apk >/dev/null 2>&1; then
                            echo "Using apk..."
                            apk add --no-cache jq unzip wget curl
                          else
                            echo "⚠️  No package manager found, attempting to use existing tools..."
                          fi

                          # Install jq manually if not available
                          if ! command -v jq >/dev/null 2>&1; then
                            echo "Installing jq manually..."
                            rm -f /tmp/jq

                            if command -v curl >/dev/null 2>&1; then
                              echo "Downloading jq with curl..."
                              curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /tmp/jq
                            elif command -v wget >/dev/null 2>&1; then
                              echo "Downloading jq with wget..."
                              wget -q https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -O /tmp/jq
                            else
                              echo "✗ Cannot download jq - no curl or wget available"
                              exit 1
                            fi

                            # Verify download
                            if [ ! -f /tmp/jq ]; then
                              echo "✗ jq download failed - file not created"
                              exit 1
                            fi

                            # Check file size
                            JQ_SIZE=$(stat -c%s /tmp/jq 2>/dev/null || stat -f%z /tmp/jq 2>/dev/null || echo "0")
                            if [ "$JQ_SIZE" -lt 1000 ]; then
                              echo "✗ jq download failed - file too small ($JQ_SIZE bytes)"
                              cat /tmp/jq 2>/dev/null || echo "Cannot read file"
                              exit 1
                            fi

                            echo "Downloaded jq ($JQ_SIZE bytes)"

                            # Set permissions
                            chmod +x /tmp/jq || {
                              echo "✗ Cannot set execute permission on /tmp/jq"
                              ls -la /tmp/jq
                              exit 1
                            }

                            # Verify it's executable
                            if [ ! -x /tmp/jq ]; then
                              echo "✗ /tmp/jq is not executable after chmod"
                              ls -la /tmp/jq
                              exit 1
                            fi

                            export PATH="/tmp:$PATH"

                            # Test jq
                            if /tmp/jq --version >/dev/null 2>&1; then
                              echo "✓ jq installed and working: $(/tmp/jq --version)"
                            else
                              echo "✗ jq installed but not working"
                              /tmp/jq --version 2>&1 || echo "Cannot execute jq"
                              exit 1
                            fi
                          fi

                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          echo "✓ Dependencies installed"
                          echo "Fetching HCP Terraform token from Vault..."

                          # Use static token (dynamic tokens lack workspace access)
                          HCP_TOKEN=$(vault kv get -field=token secret/ami-pipeline/hcp-terraform 2>&1)
                          [ -z "$HCP_TOKEN" ] || [[ "$HCP_TOKEN" == *"Error"* ]] && { echo "✗ Failed to get token from Vault: $HCP_TOKEN"; exit 1; }
                          echo "✓ Terraform Cloud token obtained"

                          # -----------------------------
                          # Trigger run
                          # -----------------------------
                          echo "Triggering Terraform run..."

                          RUN_RESPONSE=$(curl -s \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            -H "Content-Type: application/vnd.api+json" \
                            -d "{
                              \"data\": {
                                \"type\": \"runs\",
                                \"attributes\": {
                                  \"message\": \"Check S3 bucket\",
                                  \"auto-apply\": true
                                },
                                \"relationships\": {
                                  \"workspace\": {
                                    \"data\": {
                                      \"type\": \"workspaces\",
                                      \"id\": \"$WORKSPACE_ID\"
                                    }
                                  }
                                }
                              }
                            }" \
                            https://app.terraform.io/api/v2/runs)

                          # Check for errors in response
                          if echo "$RUN_RESPONSE" | grep -q '"errors"'; then
                            echo "✗ Run creation failed:"
                            echo "$RUN_RESPONSE" | jq -r '.errors[]' 2>/dev/null || echo "$RUN_RESPONSE"
                            exit 1
                          fi

                          RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.data.id')
                          [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ] && { echo "✗ Run creation failed - no run ID returned"; exit 1; }

                          echo "Run ID: $RUN_ID"

                          # -----------------------------
                          # Wait for completion
                          # -----------------------------
                          echo "Waiting for run..."

                          for i in {1..60}; do
                            STATUS=$(curl -s \
                              -H "Authorization: Bearer $HCP_TOKEN" \
                              https://app.terraform.io/api/v2/runs/$RUN_ID \
                              | jq -r '.data.attributes.status')

                            echo "Attempt $i: $STATUS"

                            case "$STATUS" in
                              applied)
                                echo "✓ Run applied successfully"

                                # Wait for state to be written
                                sleep 5

                                # For applied runs, read from current state version outputs
                                STATE_RESP=$(curl -s \
                                  -H "Authorization: Bearer $HCP_TOKEN" \
                                  https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/current-state-version-outputs)
                                echo "State API response: $STATE_RESP" | head -c 500
                                BUCKET_EXISTS=$(echo "$STATE_RESP" | jq -r '(.data // [])[] | select(.attributes.name=="bucket_exists") | .attributes.value' 2>/dev/null || echo "")

                                echo "Bucket exists (from state): $BUCKET_EXISTS"

                                if [ "$BUCKET_EXISTS" = "true" ] || [ "$BUCKET_EXISTS" = "1" ]; then
                                  RESULT="true"
                                  echo "✓ Bucket exists!"
                                else
                                  RESULT="false"
                                  echo "✗ Bucket does not exist"
                                fi
                                break
                                ;;

                              planned_and_finished)
                                echo "✓ Run planned successfully"

                                # Wait a moment for state to be updated
                                sleep 2

                                # Fetch outputs from current state version
                                echo "Fetching state version outputs..."
                                STATE_OUTPUTS=$(curl -s \
                                  -H "Authorization: Bearer $HCP_TOKEN" \
                                  https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/current-state-version-outputs)

                                echo "State outputs response:"
                                echo "$STATE_OUTPUTS" | jq -r '.data[] | "\(.attributes.name) = \(.attributes.value)"'

                                # Extract bucket_exists value
                                BUCKET_EXISTS=$(echo "$STATE_OUTPUTS" | jq -r '.data[] | select(.attributes.name=="bucket_exists") | .attributes.value')

                                echo "Extracted bucket_exists: '$BUCKET_EXISTS'"

                                if [ -z "$BUCKET_EXISTS" ]; then
                                  echo "⚠ Could not extract bucket_exists from state outputs"
                                  RESULT="false"
                                elif [ "$BUCKET_EXISTS" = "true" ]; then
                                  RESULT="true"
                                  echo "✓ Bucket exists!"
                                else
                                  RESULT="false"
                                  echo "✗ Bucket does not exist"
                                fi
                                break
                                ;;

                              errored|cancelled)
                                echo "Run failed: $STATUS"
                                RESULT="false"
                                break
                                ;;
                            esac

                            sleep 10
                          done

                          # Set default if loop timed out
                          S3_EXISTS=${RESULT:-false}

                          echo "Final Output:"
                          echo "$S3_EXISTS"
                    executionTarget: {}
                    outputVariables:
                      - name: S3_EXISTS
                        type: String
                        value: S3_EXISTS
                  timeout: 10m
    - stage:
        name: Plan S3 and Network Infrastructure
        identifier: plan_infrastructure
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Plan S3 Bucket
                  identifier: plan_s3
                  type: ShellScript
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.check_s3.spec.execution.steps.tf_check_s3.output.outputVariables.S3_EXISTS> == "false"
                  spec:
                    shell: Bash
                    executionTarget: {}
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          export VAULT_ADDR="$vault_addr"
                          export VAULT_TOKEN="$vault_token"
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          if command -v microdnf >/dev/null 2>&1; then
                            microdnf install -y jq unzip wget || true
                          fi

                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          HCP_TOKEN=$(vault kv get -field=token secret/ami-pipeline/hcp-terraform)
                          WORKSPACE_ID="ws-uGtV1DEBnULDJwzf"

                          echo "📋 Creating Terraform plan for S3 bucket..."
                          RUN_ID=$(curl -s \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            -H "Content-Type: application/vnd.api+json" \
                            -d "{
                              \"data\": {
                                \"type\": \"runs\",
                                \"attributes\": {
                                  \"message\": \"Plan S3 bucket creation\",
                                  \"auto-apply\": false
                                },
                                \"relationships\": {
                                  \"workspace\": {
                                    \"data\": {
                                      \"type\": \"workspaces\",
                                      \"id\": \"$WORKSPACE_ID\"
                                    }
                                  }
                                }
                              }
                            }" \
                            https://app.terraform.io/api/v2/runs | jq -r '.data.id')

                          echo "S3 Plan Run ID: $RUN_ID"

                          for i in {1..60}; do
                            STATUS=$(curl -s \
                              -H "Authorization: Bearer $HCP_TOKEN" \
                              https://app.terraform.io/api/v2/runs/$RUN_ID \
                              | jq -r '.data.attributes.status' | tr -d '[:space:]')

                            echo "Current status: '$STATUS' (attempt $i/60)"

                            # Check for completion statuses
                            if [[ "$STATUS" == "policy_checked" ]] || [[ "$STATUS" == "policy_override" ]] || [[ "$STATUS" == "planned_and_finished" ]] || [[ "$STATUS" == "planned" ]] || [[ "$STATUS" == "cost_estimated" ]]; then
                              echo "✓ S3 plan completed: $STATUS"
                              break
                            elif [[ "$STATUS" == "errored" ]] || [[ "$STATUS" == "cancelled" ]] || [[ "$STATUS" == "discarded" ]]; then
                              echo "✗ S3 plan failed: $STATUS"
                              exit 1
                            else
                              echo "⏳ Waiting for completion (current: $STATUS)..."
                            fi

                            sleep 10
                          done

                          # Final status check - accept cost_estimated as valid completion
                          if [[ "$STATUS" != "policy_checked" && "$STATUS" != "policy_override" && "$STATUS" != "planned_and_finished" && "$STATUS" != "planned" && "$STATUS" != "cost_estimated" ]]; then
                            echo "✗ Timeout waiting for plan completion. Final status: $STATUS"
                            exit 1
                          fi
                    outputVariables:
                      - name: S3_RUN_ID
                        type: String
                        value: $RUN_ID
              - step:
                  name: Validate S3 Sentinel Policies
                  identifier: validate_s3_policies
                  type: ShellScript
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.check_s3.spec.execution.steps.tf_check_s3.output.outputVariables.S3_EXISTS> == "false"
                  spec:
                    shell: Bash
                    executionTarget: {}
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                      - name: RUN_ID
                        type: String
                        value: <+pipeline.stages.plan_infrastructure.spec.execution.steps.plan_s3.output.outputVariables.S3_RUN_ID>
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e
                          export VAULT_ADDR="$vault_addr"
                          export VAULT_TOKEN="$vault_token"
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          if command -v microdnf >/dev/null 2>&1; then
                            microdnf install -y jq unzip wget || true
                          fi

                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          HCP_TOKEN=$(vault kv get -field=token secret/ami-pipeline/hcp-terraform)

                          echo "🔍 Validating S3 Sentinel policies..."
                          STATUS=$(curl -s \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            https://app.terraform.io/api/v2/runs/$RUN_ID \
                            | jq -r '.data.attributes.status' | tr -d '[:space:]')

                          echo "Current run status: '$STATUS'"

                          if [[ "$STATUS" == "policy_checked" ]]; then
                            echo "✓ S3 Sentinel policies passed"
                            exit 0
                          elif [[ "$STATUS" == "policy_override" ]]; then
                            echo "⚠ S3 policies require override (soft-mandatory)"
                            exit 0
                          elif [[ "$STATUS" == "planned_and_finished" ]]; then
                            echo "✓ S3 plan completed (no policies configured or policies passed)"
                            exit 0
                          elif [[ "$STATUS" == "errored" ]]; then
                            echo "✗ S3 policy validation failed"
                            exit 1
                          else
                            echo "⚠ Unexpected status: $STATUS - proceeding anyway"
                            exit 0
                          fi
              - step:
                  name: Plan Network
                  identifier: plan_network
                  type: ShellScript
                  spec:
                    shell: Bash
                    executionTarget: {}
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -e
                          export VAULT_ADDR="$vault_addr"
                          export VAULT_TOKEN="$vault_token"
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          if command -v microdnf >/dev/null 2>&1; then
                            microdnf install -y jq unzip wget || true
                          fi

                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          # Check if network already exists with all required fields
                          EXISTING_VPC=$(vault kv get -field=vpc_id secret/ami-pipeline/network 2>/dev/null || true)
                          EXISTING_SUBNET=$(vault kv get -field=subnet_id secret/ami-pipeline/network 2>/dev/null || true)

                          if [ -n "$EXISTING_VPC" ] && [ -n "$EXISTING_SUBNET" ]; then
                            echo "✓ Network already exists with complete configuration"
                            echo "  VPC ID: $EXISTING_VPC"
                            echo "  Subnet ID: $EXISTING_SUBNET"
                            RUN_ID="SKIP"
                            echo "$RUN_ID"
                            exit 0
                          elif [ -n "$EXISTING_VPC" ] || [ -n "$EXISTING_SUBNET" ]; then
                            echo "⚠ Incomplete network configuration detected in Vault"
                            echo "  VPC ID: ${EXISTING_VPC:-missing}"
                            echo "  Subnet ID: ${EXISTING_SUBNET:-missing}"
                            echo ""
                            echo "To fix this issue, delete the incomplete secret:"
                            echo "  vault kv delete secret/ami-pipeline/network"
                            echo ""
                            echo "Then re-run the pipeline to create a complete network configuration."
                            exit 1
                          fi

                          HCP_TOKEN=$(vault kv get -field=token secret/ami-pipeline/hcp-terraform)
                          WORKSPACE_ID="ws-i7ApJ9RdDPvvEQVd"

                          echo "📋 Creating Terraform plan for Network (VPC/Subnet)..."
                          RUN_ID=$(curl -s \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            -H "Content-Type: application/vnd.api+json" \
                            -d "{
                              \"data\": {
                                \"type\": \"runs\",
                                \"attributes\": {
                                  \"message\": \"Plan Network creation\",
                                  \"auto-apply\": false
                                },
                                \"relationships\": {
                                  \"workspace\": {
                                    \"data\": {
                                      \"type\": \"workspaces\",
                                      \"id\": \"$WORKSPACE_ID\"
                                    }
                                  }
                                }
                              }
                            }" \
                            https://app.terraform.io/api/v2/runs | jq -r '.data.id')

                          echo "Network Plan Run ID: $RUN_ID"

                          for i in {1..60}; do
                            STATUS=$(curl -s \
                              -H "Authorization: Bearer $HCP_TOKEN" \
                              https://app.terraform.io/api/v2/runs/$RUN_ID \
                              | jq -r '.data.attributes.status' | tr -d '[:space:]')

                            echo "Current status: '$STATUS' (attempt $i/60)"

                            # Check for completion statuses
                            if [[ "$STATUS" == "policy_checked" ]] || [[ "$STATUS" == "policy_override" ]] || [[ "$STATUS" == "planned_and_finished" ]] || [[ "$STATUS" == "planned" ]] || [[ "$STATUS" == "cost_estimated" ]]; then
                              echo "✓ Network plan completed: $STATUS"
                              break
                            elif [[ "$STATUS" == "errored" ]] || [[ "$STATUS" == "cancelled" ]] || [[ "$STATUS" == "discarded" ]]; then
                              echo "✗ Network plan failed: $STATUS"
                              exit 1
                            else
                              echo "⏳ Waiting for completion (current: $STATUS)..."
                            fi

                            sleep 10
                          done

                          # Final status check - accept cost_estimated as valid completion
