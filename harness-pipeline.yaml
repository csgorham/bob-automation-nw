    - stage:
        name: Post Deployment Summary
        identifier: post_deployment_summary
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Comment Deployment Details on PR
                  identifier: comment_deployment_details
                  type: ShellScript
                  spec:
                    shell: Bash
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                      - name: GITHUB_REPO
                        type: String
                        value: <+pipeline.tags.github_repo>
                      - name: PR_NUMBER
                        type: String
                        value: <+trigger.prNumber>
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -e

                          export VAULT_ADDR=$vault_addr
                          export VAULT_TOKEN=$vault_token
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          echo "═══════════════════════════════════════════════════════════"
                          echo "POSTING DEPLOYMENT SUMMARY TO PR"
                          echo "═══════════════════════════════════════════════════════════"

                          # Check if PR_NUMBER is available
                          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
                            echo "⚠️  No PR number available - pipeline not triggered by PR"
                            echo "   Skipping PR comment (this is normal for manual runs)"
                            exit 0
                          fi

                          echo "PR Number: $PR_NUMBER"

                          # Install dependencies
                          if command -v microdnf >/dev/null 2>&1; then
                            microdnf install -y jq unzip wget || true
                          elif command -v apt-get >/dev/null 2>&1; then
                            apt-get update -qq && apt-get install -y -qq jq unzip wget curl
                          elif command -v yum >/dev/null 2>&1; then
                            yum install -y jq unzip wget curl || true
                          elif command -v apk >/dev/null 2>&1; then
                            apk add --no-cache jq unzip wget curl
                          fi

                          # Install Vault CLI
                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          # Get GitHub token from Vault
                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)

                          # Discover all environments from Vault
                          echo "Discovering deployed environments from Vault..."
                          ENVIRONMENTS=$(vault kv list -format=json secret/ami-pipeline/ec2 2>/dev/null | jq -r '.[]' 2>/dev/null || echo "")

                          if [ -z "$ENVIRONMENTS" ]; then
                            echo "⚠️  No environments found in Vault"
                            exit 0
                          fi

                          echo "Found environments: $ENVIRONMENTS"

                          # Build deployment details table with proper newlines
                          DEPLOYMENT_TABLE="| Environment | Instance IP | Availability Zone | Region |"$'\n'
                          DEPLOYMENT_TABLE="${DEPLOYMENT_TABLE}|-------------|-------------|-------------------|--------|"$'\n'

                          # Use array to handle environment names with spaces
                          while IFS= read -r ENV; do
                            [ -z "$ENV" ] && continue
                            echo "Fetching details for environment: $ENV"

                            # Fetch instance details from Vault with error handling
                            INSTANCE_IP=$(vault kv get -field=instance_ip secret/ami-pipeline/ec2/"${ENV}" 2>/dev/null || echo "N/A")
                            AVAILABILITY_ZONE=$(vault kv get -field=availability_zone secret/ami-pipeline/ec2/"${ENV}" 2>/dev/null || echo "N/A")
                            REGION=$(vault kv get -field=region secret/ami-pipeline/ec2/"${ENV}" 2>/dev/null || echo "N/A")

                            # Sanitize values to prevent injection (remove backticks, dollar signs, newlines)
                            INSTANCE_IP=$(echo "$INSTANCE_IP" | tr -d '\n\r`$')
                            AVAILABILITY_ZONE=$(echo "$AVAILABILITY_ZONE" | tr -d '\n\r`$')
                            REGION=$(echo "$REGION" | tr -d '\n\r`$')

                            # Add row to table
                            DEPLOYMENT_TABLE="${DEPLOYMENT_TABLE}| ${ENV} | ${INSTANCE_IP} | ${AVAILABILITY_ZONE} | ${REGION} |"$'\n'
                          done <<< "$ENVIRONMENTS"

                          # Create comment body with proper formatting
                          COMMENT_BODY=$(cat <<EOF
                          ## 🚀 Deployment Complete

                          Your infrastructure has been successfully deployed and configured!

                          ### 📊 Deployed Instances

                          ${DEPLOYMENT_TABLE}
                          ### ✅ Pipeline Status

                          - **S3 Bucket**: Created/Verified
                          - **Network**: VPC and Subnet configured
                          - **AMI**: Built and uploaded to S3
                          - **EC2 Instances**: Launched and configured
                          - **Ansible Configuration**: Baseline applied
                          - **Drift Detection**: Monitoring active

                          ### 🔐 Access Information

                          All instance credentials and SSH keys are securely stored in Vault at:
                          \`secret/ami-pipeline/ec2/<environment>\`

                          ---

                          *This deployment was automated via Harness Pipeline*
                          EOF
                          )

                          # Post comment to PR with retry logic
                          echo "Posting deployment summary to PR #${PR_NUMBER}..."

                          MAX_RETRIES=3
                          RETRY_COUNT=0
                          SUCCESS=false

                          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/gh_response.json -X POST \
                              -H "Authorization: token $GITHUB_TOKEN" \
                              -H "Accept: application/vnd.github.v3+json" \
                              "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                              -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')")

                            if [ "$HTTP_CODE" = "201" ]; then
                              echo "✅ Deployment summary posted to PR successfully"
                              SUCCESS=true
                              break
                            elif [ "$HTTP_CODE" = "404" ]; then
                              echo "⚠️  PR #${PR_NUMBER} not found - may have been deleted"
                              break
                            elif [ "$HTTP_CODE" = "410" ]; then
                              echo "⚠️  PR #${PR_NUMBER} is locked or unavailable"
                              break
                            else
                              RETRY_COUNT=$((RETRY_COUNT + 1))
                              echo "⚠️  Failed to post comment (HTTP $HTTP_CODE), attempt $RETRY_COUNT of $MAX_RETRIES"
                              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                                echo "   Retrying in 5 seconds..."
                                sleep 5
                              fi
                            fi
                          done

                          if [ "$SUCCESS" = false ]; then
                            echo "⚠️  Could not post deployment summary to PR after $MAX_RETRIES attempts"
                            echo "   Response: $(cat /tmp/gh_response.json 2>/dev/null || echo 'No response')"
                            echo "   This is non-blocking - deployment was successful"
                          fi

                          echo "═══════════════════════════════════════════════════════════"
                  timeout: 5m
