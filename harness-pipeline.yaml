                          EC2_SECTION=""
                          if [ -n "$NEW_ENVS" ]; then
                            EC2_SECTION="
                          #### 🆕 New EC2 Environment(s) Detected
                          - **Environment(s):** \`${NEW_ENVS}\`
                          - **Config File(s):** \`terraform/ec2/*.auto.tfvars\`
                          - **Note:** Workspaces will be created in the Setup EC2 Workspaces stage
                          "
                          fi

                          # Build comment with console output
                          COMMENT_BODY=$(cat <<EOF
                          ## 🏗️ Infrastructure Approval Required

                          **Pipeline Execution:** [View in Harness]($PIPELINE_URL)

                          ### ✅ Completed Stages

                          #### Terraform Plans Generated
                          ${INFRA_PLANS}
                          ${EC2_SECTION}
                          #### Sentinel Policy Validation
                          - ✅ S3 policies validated
                          - ✅ Network policies validated

                          ### 📊 Console Output

                          \`\`\`
                          Stage: Check S3
                          Status: <+pipeline.stages.check_s3.status>

                          Stage: Plan Infrastructure
                          Status: <+pipeline.stages.plan_infrastructure.status>

                          S3 Exists: ${S3_EXISTS}
                          \`\`\`

                          ### 🎯 What Will Be Created

                          Upon approval:
                          1. ${S3_EXISTS:+✅ S3 bucket already exists}${S3_EXISTS:-🔨 Create S3 bucket}
                          2. ${NETWORK_PLAN_ID:+✅ Network already exists}${NETWORK_PLAN_ID:-🔨 Create VPC and Subnet}
                          3. 🔨 Build AMI with Packer
                          4. 📦 Upload manifest to S3
                          5. 🖥️ EC2 instance(s) for: ${NEW_ENVS:-existing environments}

                          ### 🔐 How to Approve

                          **Option 1:** Approve this PR on GitHub (recommended)
                          - Review the changes
                          - Click "Approve" in GitHub PR review
                          - Harness will auto-approve and continue

                          **Option 2:** Approve directly in Harness
                          - [Click here to approve in Harness]($PIPELINE_URL)

                          ---

                          ⏳ **Awaiting approval...**
                          EOF
                          )

                          # Replace variables in comment
                          COMMENT_BODY="${COMMENT_BODY//\$PIPELINE_URL/$PIPELINE_URL}"

                          # Post comment
                          curl -X POST \
                            -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github.v3+json" \
                            "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')" || echo "Failed to post comment (non-blocking)"

                          echo "✅ PR comment posted"
              - step:
                  name: Manual Approval for Infrastructure
                  identifier: manual_approval_infra
                  type: ShellScript
                  spec:
                    shell: Bash
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
