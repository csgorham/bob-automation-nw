                            elif [[ "$STATUS" == "errored" ]] || [[ "$STATUS" == "cancelled" ]]; then
                              echo "✗ S3 creation failed: $STATUS"
                              exit 1
                            fi

                            sleep 10
                          done

                          echo "✗ Apply timeout"
                          exit 1
