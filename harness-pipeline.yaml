                          # Add Python user bin to PATH
                          export PATH="$HOME/.local/bin:/opt/harness-delegate/.local/bin:/usr/local/bin:$PATH"

                          # Verify ansible is available
                          if ! command -v ansible >/dev/null 2>&1; then
                            echo "ERROR: Ansible not found in PATH"
                            exit 1
                          fi

                          echo "✓ Ansible is available"
                          ansible --version | head -1

                          # Install Vault CLI
                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          # Read GitHub token from Vault
                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)

                          # Get GitHub repository from pipeline tags
                          GITHUB_REPO="<+pipeline.tags.github_repo>"

                          # Clean up any existing clone
                          rm -rf infra

                          # Clone repo
                          echo "Cloning repository: $GITHUB_REPO"
                          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git
                          cd infra

                          # Use newly created workspace if available, otherwise use pipeline variable
                          if [ -n "$ENVIRONMENT" ] && [ "$ENVIRONMENT" != "null" ]; then
                            TARGET_ENV="$ENVIRONMENT"
                            echo "🆕 Using newly created workspace environment: $TARGET_ENV"
                          else
                            TARGET_ENV="$FALLBACK_ENVIRONMENT"
                            echo "📋 Using pipeline variable environment: $TARGET_ENV"
                          fi

                          echo "Running drift detection for environment: $TARGET_ENV"

                          # Verify environment exists in Vault
                          if ! vault kv get secret/ami-pipeline/ec2/${TARGET_ENV} >/dev/null 2>&1; then
                            echo "⚠️  Environment ${TARGET_ENV} not found in Vault"
                            exit 0
                          fi

                          # Run drift detection for the deployed environment only
                          cd ansible
                          ENV="$TARGET_ENV"

                          echo ""
                          echo "========================================="
                          echo "Detecting drift for environment: $ENV"
                          echo "========================================="

                          INSTANCE_IP=$(vault kv get -field=instance_ip secret/ami-pipeline/ec2/${ENV})
                          PRIVATE_KEY=$(vault kv get -field=private_key secret/ami-pipeline/ec2/${ENV})

                          echo "$PRIVATE_KEY" > /tmp/ec2_key_${ENV}.pem
                          chmod 600 /tmp/ec2_key_${ENV}.pem

                          echo "Running drift detection on $ENV at $INSTANCE_IP..."
                          set +e  # Don't exit on error
                          ansible-playbook drift-detection.yaml \
                            -i "$INSTANCE_IP," \
                            --private-key=/tmp/ec2_key_${ENV}.pem \
                            -u ec2-user \
                            --ssh-extra-args="-o StrictHostKeyChecking=no" \
                            -e "fail_on_drift=true"

                          # Capture drift detection result
                          DRIFT_EXIT_CODE=$?
                          set -e  # Re-enable exit on error

                          # Fetch drift report from EC2 instance
                          echo ""
                          echo "Fetching drift report for $ENV..."
                          LATEST_REPORT=$(ssh -i /tmp/ec2_key_${ENV}.pem -o StrictHostKeyChecking=no ec2-user@$INSTANCE_IP \
                            "sudo ls -t /var/log/drift-reports/drift-report-*.json 2>/dev/null | head -1" || echo "")

                          if [ -n "$LATEST_REPORT" ]; then
                            echo "Latest drift report: $LATEST_REPORT"
                            ssh -i /tmp/ec2_key_${ENV}.pem -o StrictHostKeyChecking=no ec2-user@$INSTANCE_IP \
                              "sudo cat $LATEST_REPORT" > /tmp/drift-report-${ENV}.json

                            echo ""
                            echo "═══════════════════════════════════════════════════════════"
                            echo "DRIFT REPORT SUMMARY - $ENV"
                            echo "═══════════════════════════════════════════════════════════"
                            cat /tmp/drift-report-${ENV}.json | python3 -m json.tool
                            echo "═══════════════════════════════════════════════════════════"
                          else
                            echo "⚠ No drift report found on $ENV instance"
                          fi

                          # Clean up
                          rm -f /tmp/ec2_key_${ENV}.pem

                          if [ $DRIFT_EXIT_CODE -eq 0 ]; then
                            echo "✓ Drift detection completed successfully for $ENV"
                          else
                            echo "⚠ Drift detected on $ENV (exit code: $DRIFT_EXIT_CODE)"
                          fi

                          echo ""
                          echo "✓ Drift detection complete for ${TARGET_ENV}"
                          echo "Script Output: "
                          echo "DRIFT_EXIT_CODE=$DRIFT_EXIT_CODE"
                    outputVariables:
                      - name: DRIFT_DETECTED
                        type: String
                        value: $DRIFT_EXIT_CODE
              # - step:
              #     name: Approve Drift Remediation
              #     identifier: approve_remediation
              #     type: HarnessApproval
              #     spec:
              #       approvalMessage: |
              #         Drift has been detected on the EC2 instance.

              #         Review the drift report above and approve to run automated remediation.

              #         Remediation will:
              #         - Remove unauthorized packages
              #         - Reinstall missing packages
              #         - Restore service configurations
              #         - Fix file permissions
              #         - Reinitialize AIDE database if needed

              #         Do you want to proceed with drift remediation?
              #       includePipelineExecutionHistory: true
              #       approvers:
              #         minimumCount: 1
              #         disallowPipelineExecutor: false
              #         userGroups:
              #           - account._account_all_users
              #       approverInputs: []
              #     timeout: 1d
              #     when:
              #       stageStatus: Success
              #       condition: <+pipeline.stages.drift_detection.spec.execution.steps.run_drift_detection.output.outputVariables.DRIFT_DETECTED> != "0"
              - step:
                  name: Run Drift Remediation
                  identifier: run_drift_remediation
                  type: ShellScript
                  when:
                    stageStatus: Success
                    condition: <+pipeline.stages.drift_detection.spec.execution.steps.run_drift_detection.output.outputVariables.DRIFT_DETECTED> != "0"
                  spec:
                    shell: Bash
                    executionTarget: {}
                    environmentVariables:
                      - name: vault_addr
                        type: String
                        value: <+secrets.getValue("vault_addr")>
                      - name: vault_token
                        type: String
                        value: <+secrets.getValue("vault_token")>
                      - name: NEW_WORKSPACE_ENV
                        type: String
                        value: <+pipeline.stages.setup_ec2_workspaces.spec.execution.steps.create_workspaces.output.outputVariables.NEW_WORKSPACE_ENV>
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -e

                          export VAULT_ADDR=$vault_addr
                          export VAULT_TOKEN=$vault_token
                          export VAULT_SKIP_VERIFY="true"
                          export VAULT_NAMESPACE="admin"

                          echo "═══════════════════════════════════════════════════════════"
                          echo "EC2 DRIFT REMEDIATION"
                          echo "═══════════════════════════════════════════════════════════"

                          # Install dependencies
                          if command -v apk >/dev/null 2>&1; then
                            apk add --no-cache unzip git wget python3 py3-pip
                            pip3 install ansible
                          elif command -v apt-get >/dev/null 2>&1; then
                            apt-get update -qq && apt-get install -y -qq unzip git wget python3-pip
                            pip3 install ansible
                          elif command -v yum >/dev/null 2>&1; then
                            yum install -y unzip git wget python3-pip
                            pip3 install ansible
                          elif command -v microdnf >/dev/null 2>&1; then
                            # For microdnf (UBI containers), use Python standalone builds
                            echo "Installing Python standalone build for UBI container..."
                            microdnf install -y wget tar gzip unzip git || true

                            # Check if python3 is available
                            if ! command -v python3 >/dev/null 2>&1; then
                              echo "Downloading Python standalone build..."
                              cd /tmp
                              # Use Python standalone builds from indygreg (much faster than compiling)
                              wget -q https://github.com/indygreg/python-build-standalone/releases/download/20231002/cpython-3.11.6+20231002-x86_64-unknown-linux-gnu-install_only.tar.gz
                              tar -xzf cpython-3.11.6+20231002-x86_64-unknown-linux-gnu-install_only.tar.gz
                              mv python /usr/local/python
                              ln -sf /usr/local/python/bin/python3 /usr/bin/python3
                              ln -sf /usr/local/python/bin/pip3 /usr/bin/pip3
                              rm -f cpython-3.11.6+20231002-x86_64-unknown-linux-gnu-install_only.tar.gz
                              echo "✓ Python standalone build installed"
                            fi

                            # Install ansible using pip
                            python3 -m pip install --user ansible
                          fi

                          export PATH="$HOME/.local/bin:/opt/harness-delegate/.local/bin:/usr/local/bin:$PATH"

                          if ! command -v ansible >/dev/null 2>&1; then
                            echo "ERROR: Ansible not found"
                            exit 1
                          fi

                          # Install Vault CLI
                          # Install Vault (always verify binary is valid)
                          if ! /tmp/vault version >/dev/null 2>&1; then
                            echo "Installing Vault..."
                            ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
                            rm -f /tmp/vault /tmp/vault.zip
                            curl -sL "https://releases.hashicorp.com/vault/1.15.0/vault_1.15.0_linux_${ARCH}.zip" -o /tmp/vault.zip
                            HDR_OFFSET=63
                            dd if=/tmp/vault.zip bs=1 skip=$HDR_OFFSET of=/tmp/vault.deflate 2>/dev/null
                            printf "\x1f\x8b\x08\x00\x00\x00\x00\x00\x00\x03" > /tmp/vault.gz
                            cat /tmp/vault.deflate >> /tmp/vault.gz
                            gzip -d < /tmp/vault.gz > /tmp/vault 2>/dev/null || true
                            rm -f /tmp/vault.deflate /tmp/vault.gz
                            chmod +x /tmp/vault
                            if ! /tmp/vault version >/dev/null 2>&1; then
                              echo "✗ Vault binary invalid after extraction (size: $(wc -c < /tmp/vault))"
                              exit 1
                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          # Read GitHub token from Vault
                          GITHUB_TOKEN=$(vault kv get -field=token secret/ami-pipeline/github)
                          GITHUB_REPO="<+pipeline.tags.github_repo>"

                          # Clean up and clone
                          rm -rf infra
                          echo "Cloning repository: $GITHUB_REPO"
                          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git
                          cd infra

                          # Check if we should only remediate drift for the newly created workspace
                          if [ -n "$NEW_WORKSPACE_ENV" ] && [ "$NEW_WORKSPACE_ENV" != "null" ]; then
                            echo "🆕 Remediating drift only for newly created workspace: $NEW_WORKSPACE_ENV"
                            ENVIRONMENTS="$NEW_WORKSPACE_ENV"
                          else
                            # Auto-discover all environments from Vault
                            echo "Discovering all environments from Vault..."
                            ENVIRONMENTS=$(vault kv list -format=json secret/ami-pipeline/ec2 | jq -r '.[]' 2>/dev/null || echo "")

                            if [ -z "$ENVIRONMENTS" ]; then
                              echo "⚠️  No environments found in Vault"
                              exit 0
                            fi

                            echo "Found environments: $ENVIRONMENTS"
                          fi

                          # Run drift remediation for each environment
                          cd ansible
                          for ENV in $ENVIRONMENTS; do
                            echo ""
                            echo "========================================="
                            echo "Remediating drift for environment: $ENV"
                            echo "========================================="

                            INSTANCE_IP=$(vault kv get -field=instance_ip secret/ami-pipeline/ec2/${ENV})
                            PRIVATE_KEY=$(vault kv get -field=private_key secret/ami-pipeline/ec2/${ENV})

                            echo "$PRIVATE_KEY" > /tmp/ec2_key_${ENV}.pem
                            chmod 600 /tmp/ec2_key_${ENV}.pem

                            echo "Running drift remediation on $ENV at $INSTANCE_IP..."
                            ansible-playbook drift-remediation.yaml \
                              -i "$INSTANCE_IP," \
                              --private-key=/tmp/ec2_key_${ENV}.pem \
                              -u ec2-user \
                              --ssh-extra-args="-o StrictHostKeyChecking=no"

                            # Fetch remediation report
                            echo ""
                            echo "Fetching remediation report for $ENV..."
                            LATEST_REPORT=$(ssh -i /tmp/ec2_key_${ENV}.pem -o StrictHostKeyChecking=no ec2-user@$INSTANCE_IP \
                              "sudo ls -t /var/log/drift-reports/remediation-report-*.json 2>/dev/null | head -1" || echo "")

                            if [ -n "$LATEST_REPORT" ]; then
                              echo "Latest remediation report: $LATEST_REPORT"
                              ssh -i /tmp/ec2_key_${ENV}.pem -o StrictHostKeyChecking=no ec2-user@$INSTANCE_IP \
                                "sudo cat $LATEST_REPORT" > /tmp/remediation-report-${ENV}.json

                              echo ""
                              echo "═══════════════════════════════════════════════════════════"
                              echo "REMEDIATION REPORT SUMMARY - $ENV"
                              echo "═══════════════════════════════════════════════════════════"
                              cat /tmp/remediation-report-${ENV}.json | python3 -m json.tool
                              echo "═══════════════════════════════════════════════════════════"
                            fi

                            # Clean up
                            rm -f /tmp/ec2_key_${ENV}.pem

                            echo "✓ Drift remediation completed for $ENV"
                          done

                          echo ""
                          echo "✓ Drift remediation completed successfully for all environments"
                          echo "  All systems have been restored to baseline configuration"
