                            fi
                            echo "✓ Vault installed: $(/tmp/vault version | head -1)"
                          fi
                          export PATH="/tmp:$PATH"

                          HCP_TOKEN=$(vault kv get -field=token secret/ami-pipeline/hcp-terraform)

                          echo "🚀 Applying approved S3 Terraform plan..."
                          echo "Run ID: $RUN_ID"

                          # Check current status first
                          CURRENT_STATUS=$(curl -s \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            https://app.terraform.io/api/v2/runs/$RUN_ID \
                            | jq -r '.data.attributes.status' | tr -d '[:space:]')

                          echo "Current status: '$CURRENT_STATUS'"

                          # If already finished (no changes), skip apply
                          if [[ "$CURRENT_STATUS" == "planned_and_finished" ]]; then
                            echo "✓ S3 plan shows no changes needed (already up-to-date)"
                            echo "  Skipping apply as infrastructure is already in desired state"
                            exit 0
                          fi

                          # Apply the run
                          APPLY_RESPONSE=$(curl -s -X POST \
                            -H "Authorization: Bearer $HCP_TOKEN" \
                            -H "Content-Type: application/vnd.api+json" \
                            "https://app.terraform.io/api/v2/runs/$RUN_ID/actions/apply")

                          # Check if apply was accepted
                          if echo "$APPLY_RESPONSE" | grep -q "errors"; then
                            echo "✗ Failed to trigger apply:"
                            echo "$APPLY_RESPONSE" | jq -r '.errors[].title' 2>/dev/null || echo "$APPLY_RESPONSE"
                            exit 1
                          fi

                          # Wait for apply to complete
                          for i in {1..60}; do
                            STATUS=$(curl -s \
                              -H "Authorization: Bearer $HCP_TOKEN" \
                              https://app.terraform.io/api/v2/runs/$RUN_ID \
                              | jq -r '.data.attributes.status' | tr -d '[:space:]')

                            echo "Apply status ($i/60): '$STATUS'"

                            if [[ "$STATUS" == "applied" ]]; then
                              echo "✓ S3 bucket created successfully"
                              BUCKET_NAME=$(vault kv get -field=bucket_name secret/ami-pipeline/s3 2>/dev/null || echo "")
