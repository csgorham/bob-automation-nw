---
# Handlers for drift remediation

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart httpd
  ansible.builtin.systemd:
    name: httpd
    state: restarted

