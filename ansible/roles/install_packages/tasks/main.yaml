    mode: '0644'

- name: Install security and monitoring tools
  ansible.builtin.yum:
    name:
      - aide              # Intrusion detection
      - fail2ban          # Brute force protection
      - chrony            # Time synchronization
      - htop              # System monitoring
      - net-tools         # Network utilities
    state: present

- name: Start and enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

- name: Start and enable chrony
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

- name: Configure fail2ban for SSH and HTTP
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      logpath = /var/log/secure
      maxretry = 3
      bantime = 3600

      [apache-auth]
      enabled = true
      port = http,https
      logpath = /var/log/httpd/error_log
      maxretry = 5
      bantime = 3600
    mode: '0644'
  notify: Restart fail2ban

- name: Load port configuration from YAML
  ansible.builtin.set_fact:
    ports_config: "{{ lookup('file', playbook_dir + '/../terraform/ec2/ports.yaml') | from_yaml }}"

- name: Open ports in firewall dynamically (if firewalld is running)
  ansible.builtin.firewalld:
    port: "{{ item.port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ ports_config.ingress_ports }}"
  ignore_errors: true


- name: Initialize AIDE database
  ansible.builtin.command:
    cmd: aide --init
    creates: /var/lib/aide/aide.db.new.gz

- name: Move AIDE database to production
  ansible.builtin.command:
    cmd: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
    creates: /var/lib/aide/aide.db.gz