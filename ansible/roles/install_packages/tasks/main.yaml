---
- name: Install Apache web server and SSL module
  ansible.builtin.yum:
    name:
      - httpd
      - mod_ssl
    state: present

- name: Load port configuration from YAML for Apache
  ansible.builtin.set_fact:
    ports_config_apache: "{{ lookup('file', playbook_dir + '/../terraform/ec2/ports.yaml') | from_yaml }}"

- name: Configure Apache to listen on all HTTP ports dynamically
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    line: "Listen {{ item.port }}"
    insertafter: '^Listen 80'
    state: present
  loop: "{{ ports_config_apache.ingress_ports }}"
  when: item.port not in [22, 80, 443]  # Skip SSH, default HTTP, and HTTPS
  notify: Restart Apache

- name: Generate self-signed SSL certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/pki/tls/private/apache-selfsigned.key
      -out /etc/pki/tls/certs/apache-selfsigned.crt
      -subj "/C=US/ST=State/L=City/O=Organization/CN={{ ansible_default_ipv4.address }}"
    creates: /etc/pki/tls/certs/apache-selfsigned.crt

- name: Configure SSL certificate in Apache
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf
    regexp: '^SSLCertificateFile'
    line: 'SSLCertificateFile /etc/pki/tls/certs/apache-selfsigned.crt'
    state: present

- name: Configure SSL key in Apache
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf
    regexp: '^SSLCertificateKeyFile'
    line: 'SSLCertificateKeyFile /etc/pki/tls/private/apache-selfsigned.key'
    state: present

- name: Ensure Apache is started and enabled
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true

- name: Restart Apache to apply port configuration
  ansible.builtin.systemd:
    name: httpd
    state: restarted
  when: ports_config_apache is defined

- name: Flush handlers
  meta: flush_handlers

- name: Create a simple index page
